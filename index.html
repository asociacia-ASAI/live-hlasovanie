<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live hlasovanie</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="icon" href="img/asai-icon-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ASAI Design System – farby, písmo, zaoblenia */
  :root {
    --asai-orange: #ffb101; --asai-orange-dark: #e69c00;
    --asai-navy: #0a0747; --asai-navy-light: #141064;
    --asai-teal: #18e8cb; --asai-cream: #fff8ed; --asai-white: #ffffff;
    --text: var(--asai-white); --muted: rgba(255,255,255,.72);
    --track: rgba(255,255,255,.10);
    --glass-bg: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.05));
    --glass-border: 1px solid rgba(255,255,255,.28);
    --radius-md: 16px; --radius-lg: 28px; --radius-pill: 999px;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--asai-navy); }
  body { margin: 0; color: var(--text); min-height: 100vh; overflow-x: hidden;
         font: 500 16px/1.45 "Montserrat", system-ui, sans-serif; position: relative; }
  /* Molekulový motív v rohoch */
  .motif { position: fixed; pointer-events: none; z-index: 0; opacity: .9; }
  .motif.br { right: -40px; bottom: -60px; width: 220px; }
  .motif.tl { left: -30px; top: -30px; width: 170px; transform: rotate(180deg); opacity: .5; }
  .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .brand img { height: 74px; width: auto; display: block; }
  .brand .sep { width: 2px; height: 58px; background: rgba(255,255,255,.18); border-radius: 2px; }
  h1 { font-size: clamp(24px, 3.4vw, 42px); font-weight: 900; text-transform: uppercase; letter-spacing: .01em;
       margin: 0 0 10px; line-height: 1.05; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted);
            background: var(--glass-bg); border: var(--glass-border); border-radius: var(--radius-pill); padding: 6px 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--asai-teal);
         box-shadow: 0 0 0 0 rgba(24,232,203,.6); animation: pulse 2s infinite; }
  .dot.off { background: #ff7a6b; animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(24,232,203,0); } 100% { box-shadow: 0 0 0 0 rgba(24,232,203,0); } }
  .side { display: flex; gap: 18px; align-items: stretch; }
  .total { text-align: center; background: var(--asai-orange); color: var(--asai-navy); border-radius: var(--radius-lg);
           padding: 16px 26px; display: flex; flex-direction: column; justify-content: center; min-width: 150px; }
  .total b { display: block; font-size: 60px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .total span { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-top: 6px; }
  .total.bump b { animation: bump .6s ease; }
  @keyframes bump { 30% { transform: scale(1.2); } }
  .qr { background: var(--asai-white); padding: 10px; border-radius: var(--radius-md); cursor: zoom-in;
        display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .qr img, .qr canvas { display: block; width: 116px !important; height: 116px !important; }
  .qr small { color: var(--asai-navy); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 22px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .brand img { height: 54px; } .brand .sep { display: none; } }
  .card { background: var(--asai-navy-light); border-radius: var(--radius-lg); padding: 24px 26px; }
  .card h2 { font-size: 19px; font-weight: 800; text-transform: uppercase; line-height: 1.2; margin: 0 0 6px; }
  .card .meta { display: inline-block; color: var(--asai-teal); font-size: 12px; font-weight: 700;
                text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; }
  .row { margin: 12px 0; }
  .row .lbl { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; margin-bottom: 6px; }
  .row .lbl em { font-style: normal; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 16px; background: var(--track); border-radius: var(--radius-pill); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: var(--radius-pill); background: var(--asai-orange);
           transition: width .8s cubic-bezier(.4,0,.2,1); }
  .row.top .lbl span { font-weight: 800; }
  .row.top .lbl em { color: var(--asai-orange); }
  .texts { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
  .texts li { background: var(--asai-cream); color: var(--asai-navy); border-radius: var(--radius-md);
              padding: 10px 16px; margin: 8px 0; font-size: 15px; font-weight: 600; }
  .texts li.fresh { animation: fresh 2.5s ease; }
  @keyframes fresh { 0% { background: var(--asai-teal); } 100% { background: var(--asai-cream); } }
  .note { background: var(--glass-bg); border: var(--glass-border); border-radius: var(--radius-pill);
          padding: 10px 20px; margin-bottom: 22px; font-size: 14px; font-weight: 600; }
  .err { border-color: #ff7a6b; color: #ffd9d4; }
  .empty { color: var(--muted); text-align: center; padding: 70px 0; font-size: 20px; font-weight: 700; text-transform: uppercase; }
  /* Veľký QR na celú obrazovku – na premietanie */
  #bigqr { position: fixed; inset: 0; background: var(--asai-navy); display: none; flex-direction: column;
           align-items: center; justify-content: center; gap: 24px; cursor: zoom-out; z-index: 10; }
  #bigqr.on { display: flex; }
  #bigqr .box { background: var(--asai-white); padding: 24px; border-radius: var(--radius-lg); }
  #bigqr .box img, #bigqr .box canvas { width: min(64vh, 80vw) !important; height: min(64vh, 80vw) !important; }
  #bigqr p { margin: 0; background: var(--asai-orange); color: var(--asai-navy); font-size: clamp(20px, 3vw, 32px);
             font-weight: 900; text-transform: uppercase; padding: 12px 36px; border-radius: var(--radius-pill); }
  #bigqr .logo { position: absolute; top: 24px; left: 28px; height: 64px; }
  /* Hlavička karty: otázka + súhrnný údaj */
  .card { cursor: zoom-in; transition: transform .2s cubic-bezier(.4,0,.2,1); }
  .card:hover { transform: translateY(-2px); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .kpi { flex: none; text-align: right; background: var(--asai-orange); color: var(--asai-navy);
         border-radius: var(--radius-md); padding: 8px 14px; min-width: 84px; }
  .kpi:empty { display: none; }
  .kpi b { display: block; font-size: 30px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi small { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
  .kpi.lead b { font-size: 16px; line-height: 1.2; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Pruhový graf */
  .hb { display: grid; gap: 10px; }
  .hrow { position: relative; height: 46px; background: var(--track); border-radius: var(--radius-pill); overflow: hidden; }
  .hrow i { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(255,248,237,.28);
            border-radius: var(--radius-pill); transition: width .8s cubic-bezier(.4,0,.2,1); }
  .hrow.top i { background: var(--asai-orange); }
  .hrow .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between;
             gap: 12px; padding: 0 18px; font-size: 16px; font-weight: 700; }
  .hrow .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow .t em { font-style: normal; font-weight: 900; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hrow .t em small { font-size: 12px; font-weight: 700; opacity: .75; margin-left: 6px; }
  .hrow.top .t { color: var(--asai-navy); }
  .hrow.top .t em small { opacity: .8; }
  /* Stĺpcový graf pre stupnice */
  .cols { display: flex; align-items: flex-end; gap: 10px; height: 230px; padding-top: 28px; }
  .col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .col .area { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; min-height: 0; }
  .col .v { font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; }
  .col .v small { display: block; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); }
  .col .c { width: 100%; max-width: 90px; height: 0; min-height: 4px; background: rgba(255,248,237,.28);
            border-radius: 14px 14px 6px 6px; transition: height .8s cubic-bezier(.4,0,.2,1); }
  .col.top .c { background: var(--asai-orange); }
  .col .x { font-size: 16px; font-weight: 800; color: var(--asai-teal); }
  /* Režim prezentácie – jedna otázka na celú obrazovku */
  body.focus .wrap > header, body.focus #notice { display: none; }
  body.focus .grid { display: block; }
  body.focus .card { display: none; cursor: zoom-out; transform: none; }
  body.focus .card.on { display: block; min-height: calc(100vh - 92px); padding: 40px 48px; }
  body.focus .card.on h2 { font-size: clamp(26px, 3.6vw, 48px); }
  body.focus .card.on .meta { font-size: 15px; margin-bottom: 32px; }
  body.focus .card.on .kpi { padding: 14px 22px; } body.focus .card.on .kpi b { font-size: 48px; }
  body.focus .card.on .kpi.lead b { font-size: 26px; max-width: 360px; }
  body.focus .card.on .hb { gap: 16px; } body.focus .card.on .hrow { height: 72px; }
  body.focus .card.on .hrow .t { font-size: 24px; padding: 0 28px; } body.focus .card.on .hrow .t em { font-size: 32px; }
  body.focus .card.on .cols { height: calc(100vh - 380px); min-height: 260px; }
  body.focus .card.on .col .v { font-size: 30px; } body.focus .card.on .col .x { font-size: 26px; }
  body.focus .card.on .texts { max-height: calc(100vh - 300px); } body.focus .card.on .texts li { font-size: 22px; }
  .hint { display: none; position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 5;
          background: var(--glass-bg); border: var(--glass-border); border-radius: var(--radius-pill);
          padding: 6px 16px; font-size: 12px; font-weight: 600; color: var(--muted); }
  body.focus .hint { display: block; }
  /* Pódium – 1., 2., 3. miesto */
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 12px; height: 270px; padding-top: 8px; }
  .step { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .step .who { font-size: 18px; font-weight: 900; text-align: center; line-height: 1.15; margin-bottom: 4px;
               max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .num { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .step .blk { width: 100%; border-radius: 22px 22px 8px 8px; display: flex; align-items: flex-start; justify-content: center;
               padding-top: 12px; font-size: 40px; font-weight: 900; transition: height .8s cubic-bezier(.4,0,.2,1); min-height: 64px; }
  .step.p1 .blk { background: var(--asai-orange); color: var(--asai-navy); }
  .step.p2 .blk { background: var(--asai-teal); color: var(--asai-navy); }
  .step.p3 .blk { background: var(--asai-cream); color: var(--asai-navy); }
  .step.p1 .who { font-size: 22px; color: var(--asai-orange); }
  .step.none { visibility: hidden; }
  .rest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .rest span { background: var(--track); border-radius: var(--radius-pill); padding: 6px 14px; font-size: 13px; font-weight: 600; }
  .rest span b { font-weight: 900; margin-right: 6px; color: var(--muted); }
  body.focus .card.on .podium { height: calc(100vh - 360px); min-height: 300px; gap: 24px; }
  body.focus .card.on .step .who { font-size: 30px; } body.focus .card.on .step.p1 .who { font-size: 40px; }
  body.focus .card.on .step .num { font-size: 18px; } body.focus .card.on .step .blk { font-size: 72px; }
  body.focus .card.on .rest span { font-size: 18px; }
</style>
</head>
<body>
<img class="motif br" src="img/node-motif-corner-large.png" alt="">
<div class="wrap">
  <header>
    <div class="brand">
      <img src="img/asai-logo-full.png" alt="ASAI – Asociácia AI">
      <span class="sep"></span>
      <div>
        <h1 id="title">Výsledky hlasovania</h1>
        <div class="status"><span class="dot" id="dot"></span><span id="status">Pripájam sa…</span></div>
      </div>
    </div>
    <div class="side">
      <div class="total" id="totalBox"><b id="total">0</b><span>odpovedí</span></div>
      <div class="qr" id="qrWrap" title="Klikni pre veľký QR kód"><div id="qr"></div><small>Hlasujte</small></div>
    </div>
  </header>
  <div id="notice"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="hint">← → ďalšia otázka · Esc alebo klik späť na prehľad</div>
<div id="bigqr"><img class="logo" src="img/asai-logo-full.png" alt=""><div class="box" id="qrBig"></div><p>Naskenujte a hlasujte</p></div>

<script>
const REFRESH_MS = 3000;
let lastTotal = null, qrDone = false, seenTexts = new Set();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function makeQr(url) {
  if (qrDone || !url || typeof QRCode === "undefined") return;
  new QRCode($("qr"), { text: url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
  new QRCode($("qrBig"), { text: url, width: 800, height: 800, correctLevel: QRCode.CorrectLevel.M });
  qrDone = true;
}
$("qrWrap").onclick = () => $("bigqr").classList.add("on");
$("bigqr").onclick = () => $("bigqr").classList.remove("on");

function cardFor(q, i) {
  let card = document.querySelector(`[data-q="${i}"]`);
  if (!card) {
    card = document.createElement("div");
    card.className = "card"; card.dataset.q = i;
    card.innerHTML = `<div class="head"><div><h2></h2><div class="meta"></div></div><div class="kpi"></div></div><div class="body"></div>`;
    card.onclick = () => toggleFocus(i);
    $("grid").appendChild(card);
  }
  return card;
}

const fmt = (x, d = 1) => x.toLocaleString("sk-SK", { minimumFractionDigits: d, maximumFractionDigits: d });

// Je to stupnica (1–5, 1–10, 0–10 …)? Doplníme aj hodnoty, za ktoré zatiaľ nikto nehlasoval.
function asScale(q) {
  if (q.type !== "choice" || !q.options.length) return null;
  const nums = q.options.map((o) => Number(o.label));
  if (!nums.every((n) => Number.isInteger(n) && n >= 0 && n <= 10)) return null;
  const lo = Math.min(1, ...nums), hi = Math.max(5, ...nums);
  if (hi - lo > 10) return null;
  const by = new Map(q.options.map((o) => [Number(o.label), o.count]));
  const opts = [];
  for (let v = lo; v <= hi; v++) opts.push({ label: String(v), count: by.get(v) || 0 });
  const n = opts.reduce((s, o) => s + o.count, 0);
  const avg = n ? opts.reduce((s, o) => s + Number(o.label) * o.count, 0) / n : 0;
  return { opts, avg, hi };
}

function setKpi(card, html, cls = "") {
  const k = card.querySelector(".kpi");
  k.className = "kpi " + cls; k.innerHTML = html;
}

// Spoločná logika: zachová existujúce prvky, aby sa grafy plynulo animovali
function upsert(container, key, make) {
  let el = [...container.children].find((c) => c.dataset.l === key);
  if (!el) { el = make(); el.dataset.l = key; }
  container.appendChild(el);
  return el;
}

function renderScale(card, body, sc) {
  let wrap = body.querySelector(".cols");
  if (!wrap) { body.innerHTML = ""; wrap = document.createElement("div"); wrap.className = "cols"; body.appendChild(wrap); }
  const max = Math.max(1, ...sc.opts.map((o) => o.count));
  const total = Math.max(1, sc.opts.reduce((s, o) => s + o.count, 0));
  const keep = new Set();
  sc.opts.forEach((o) => {
    const col = upsert(wrap, o.label, () => {
      const d = document.createElement("div"); d.className = "col";
      d.innerHTML = `<div class="area"><div class="v"></div><div class="c"></div></div><div class="x">${esc(o.label)}</div>`; return d;
    });
    col.querySelector(".v").innerHTML = `${o.count}<small>${Math.round((o.count / total) * 100)} %</small>`;
    col.classList.toggle("top", o.count === max && o.count > 0);
    requestAnimationFrame(() => (col.querySelector(".c").style.height = `${(o.count / max) * 78}%`));
    keep.add(o.label);
  });
  [...wrap.children].forEach((c) => { if (!keep.has(c.dataset.l)) c.remove(); });
  setKpi(card, `<b>${fmt(sc.avg)}</b><small>priemer z ${sc.hi}</small>`);
}

function renderBars(card, body, q) {
  let wrap = body.querySelector(".hb");
  if (!wrap) { body.innerHTML = ""; wrap = document.createElement("div"); wrap.className = "hb"; body.appendChild(wrap); }
  const max = Math.max(1, ...q.options.map((o) => o.count));
  // jedna možnosť: % zo všetkých hlasov; viac možností: % respondentov, ktorí ju zaškrtli
  const base = q.type === "multi" ? Math.max(1, q.answered) : Math.max(1, q.options.reduce((s, o) => s + o.count, 0));
  const keep = new Set();
  q.options.forEach((o) => {
    const row = upsert(wrap, o.label, () => {
      const d = document.createElement("div"); d.className = "hrow";
      d.innerHTML = `<i></i><div class="t"><span>${esc(o.label)}</span><em></em></div>`; return d;
    });
    row.querySelector("em").innerHTML = `${Math.round((o.count / base) * 100)} %<small>${o.count}</small>`;
    row.classList.toggle("top", o.count === max && o.count > 0);
    requestAnimationFrame(() => (row.querySelector("i").style.width = `${Math.max(o.count ? 3 : 0, (o.count / max) * 100)}%`));
    keep.add(o.label);
  });
  [...wrap.children].forEach((c) => { if (!keep.has(c.dataset.l)) c.remove(); });
  const leaders = q.options.filter((o) => o.count === max && o.count > 0);
  if (leaders.length === 1) setKpi(card, `<small>vedie</small><b>${esc(leaders[0].label)}</b>`, "lead");
  else setKpi(card, "");
}

const hlasy = (n) => n === 1 ? "1 hlas" : (n >= 2 && n <= 4 ? `${n} hlasy` : `${n} hlasov`);

function renderPodium(card, body, q) {
  let wrap = body.querySelector(".podium");
  if (!wrap) {
    body.innerHTML = `<div class="podium">${[2, 1, 3].map((p) =>
      `<div class="step p${p}"><div class="who"></div><div class="num"></div><div class="blk">${p}.</div></div>`).join("")}</div><div class="rest"></div>`;
    wrap = body.querySelector(".podium");
  }
  const sorted = [...q.options].filter((o) => o.count > 0).sort((a, b) => b.count - a.count);
  const base = q.type === "multi" ? Math.max(1, q.answered) : Math.max(1, sorted.reduce((s, o) => s + o.count, 0));
  const heights = { 1: 100, 2: 70, 3: 48 };
  [1, 2, 3].forEach((p) => {
    const st = wrap.querySelector(".p" + p), o = sorted[p - 1];
    st.classList.toggle("none", !o);
    if (!o) return;
    st.querySelector(".who").textContent = o.label;
    st.querySelector(".num").textContent = `${hlasy(o.count)} · ${Math.round((o.count / base) * 100)} %`;
    st.querySelector(".blk").style.height = `calc(${heights[p]}% - 70px)`;
  });
  body.querySelector(".rest").innerHTML = sorted.slice(3)
    .map((o, i) => `<span><b>${i + 4}.</b>${esc(o.label)} · ${o.count}</span>`).join("");
  setKpi(card, sorted[0] ? `<small>víťaz</small><b>${esc(sorted[0].label)}</b>` : "", "lead");
}

function renderChoice(card, body, q) {
  if (q.podium) return renderPodium(card, body, q);
  const sc = asScale(q);
  if (sc) renderScale(card, body, sc); else renderBars(card, body, q);
}

function renderText(body, q, i) {
  let ul = body.querySelector("ul");
  if (!ul) { ul = document.createElement("ul"); ul.className = "texts"; body.appendChild(ul); }
  ul.innerHTML = q.answers.map((a) => {
    const key = i + "|" + a;
    const fresh = lastTotal !== null && !seenTexts.has(key);
    seenTexts.add(key);
    return `<li class="${fresh ? "fresh" : ""}">${esc(a)}</li>`;
  }).join("");
}

function render(d) {
  $("title").textContent = d.title || "Výsledky hlasovania";
  document.title = d.title || "Live hlasovanie";
  makeQr(d.formUrl);

  const n = $("notice");
  if (d.error) n.innerHTML = `<div class="note err">⚠️ ${esc(d.error)}</div>`;
  else if (d.demo) n.innerHTML = `<div class="note">Toto sú ukážkové dáta. Po nastavení SHEET_ID vo Verceli sa tu objavia skutočné odpovede.</div>`;
  else n.innerHTML = "";

  if (lastTotal !== null && d.total > lastTotal) {
    $("totalBox").classList.remove("bump"); void $("totalBox").offsetWidth; $("totalBox").classList.add("bump");
  }
  $("total").textContent = d.total;
  lastTotal = d.total;

  if (!d.questions.length && !d.error) {
    $("grid").innerHTML = `<div class="empty">Zatiaľ žiadne odpovede – naskenujte QR kód</div>`;
    return;
  }
  $("grid").querySelector(".empty")?.remove();
  d.questions.forEach((q, i) => {
    const card = cardFor(q, i);
    card.querySelector("h2").textContent = q.title;
    card.querySelector(".meta").textContent =
      `${q.answered} odpovedí` + (q.type === "multi" ? " · viac možností naraz" : "");
    const body = card.querySelector(".body");
    if (q.type === "text") { setKpi(card, ""); renderText(body, q, i); } else renderChoice(card, body, q);
  });
  [...$("grid").querySelectorAll(".card")].forEach((c) => { if (+c.dataset.q >= d.questions.length) c.remove(); });
}

let focusIdx = null;
function toggleFocus(i) {
  focusIdx = focusIdx === i ? null : i;
  applyFocus();
}
function applyFocus() {
  const cards = [...$("grid").querySelectorAll(".card")];
  if (focusIdx !== null && focusIdx >= cards.length) focusIdx = null;
  document.body.classList.toggle("focus", focusIdx !== null);
  cards.forEach((c) => c.classList.toggle("on", +c.dataset.q === focusIdx));
  window.scrollTo(0, 0);
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { focusIdx = null; applyFocus(); $("bigqr").classList.remove("on"); return; }
  const n = $("grid").querySelectorAll(".card").length;
  if (focusIdx === null || !n) return;
  if (e.key === "ArrowRight" || e.key === " ") focusIdx = (focusIdx + 1) % n;
  else if (e.key === "ArrowLeft") focusIdx = (focusIdx - 1 + n) % n;
  else return;
  e.preventDefault(); applyFocus();
});

async function tick() {
  try {
    const r = await fetch("/api/results?t=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    render(d);
    $("dot").classList.remove("off");
    $("status").textContent = "Live · aktualizované " + new Date().toLocaleTimeString("sk-SK");
  } catch (e) {
    $("dot").classList.add("off");
    $("status").textContent = "Spojenie prerušené, skúšam znova…";
  } finally {
    setTimeout(tick, document.hidden ? REFRESH_MS * 4 : REFRESH_MS);
  }
}
tick();
</script>
